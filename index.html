<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Driffield Cadet Tracking Map</title>
    <link rel="stylesheet" href="https://unpkg.com" />
    <script src="https://unpkg.com"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: sans-serif; }
        #map { height: 100%; width: 100%; }
        #status-bar {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: rgba(255,255,255,0.9); padding: 8px 12px;
            border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            font-size: 12px; font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="status-bar" style="color: orange;">⏳ Initializing Connection...</div>
    <div id="map"></div>

    <script src="https://unpkg.com"></script>
    <script>
        const map = L.map('map').setView([54.0145, -0.4720], 14);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19, attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        const markers = {};
        const statusBar = document.getElementById('status-bar');

        // Connect to the public Meshtastic broker over secure port 443
        const client = mqtt.connect('wss://mqtt.meshtastic.org:443', {
            clientId: 'driffield_viewer_' + Math.random().toString(16).substr(2, 8),
            keepalive: 60, reconnectPeriod: 1000
        });

        client.on('connect', () => {
            statusBar.innerText = "🟢 Map Active (Waiting for Tags)";
            statusBar.style.color = "green";
            
            // Subscribe to BOTH upcoming Meshtastic hardware and current OwnTracks phone apps
            client.subscribe('driffield/cadets/+/location');
            client.subscribe('owntracks/driffield/#');
        });

        client.on('message', (topic, message) => {
            try {
                const data = JSON.parse(message.toString());
                const topicParts = topic.split('/');
                
                let lat, lon, name, type, deviceId;

                // Handle OwnTracks App Format
                if (topicParts[0] === 'owntracks') {
                    deviceId = topicParts[2] || 'staff_phone';
                    lat = data.lat;
                    lon = data.lon;
                    name = "Staff: " + (deviceId.toUpperCase());
                    type = "Staff";
                } 
                // Handle Meshtastic Hardware Format
                else {
                    deviceId = topicParts[2];
                    lat = data.lat;
                    lon = data.lon;
                    name = data.name || deviceId;
                    type = "Cadet";
                }

                if (lat && lon) {
                    const lastUpdated = new Date().toLocaleTimeString();
                    statusBar.innerText = "🟢 Map Active (Data Received)";
                    
                    if (markers[deviceId]) {
                        markers[deviceId].setLatLng([lat, lon]);
                        markers[deviceId].getPopup().setContent(`<b>${name}</b> (${type})<br>Last Seen: ${lastUpdated}`);
                    } else {
                        markers[deviceId] = L.marker([lat, lon]).addTo(map)
                            .bindPopup(`<b>${name}</b> (${type})<br>Last Seen: ${lastUpdated}`);
                        
                        // Automatically center the view onto the phone's test location
                        map.panTo([lat, lon]);
                    }
                }
            } catch (e) {
                console.error("Parsing error", e);
            }
        });
    </script>
</body>
</html>
