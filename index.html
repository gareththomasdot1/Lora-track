<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Driffield Cadet Tracking Map</title>
    <!-- Leaflet CSS for Map Styling -->
    <link rel="stylesheet" href="https://unpkg.com" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: sans-serif; }
        #map { height: 100%; width: 100%; }
        #status-bar {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: rgba(255,255,255,0.9); padding: 8px 12px;
            border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            font-size: 12px; font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="status-bar" style="color: orange;">⏳ Connecting to Platform...</div>
    <div id="map"></div>

    <!-- Leaflet JS for Map Logic -->
    <script src="https://unpkg.com"></script>
    <script>
        // Initialize map centered over Driffield Cadet Training Area
        const map = L.map('map').setView([54.0145, -0.4720], 14);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19, attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        const markers = {};
        const statusBar = document.getElementById('status-bar');

        // Your validated ThingSpeak Credentials
        const channelId = "3526815"; 
        const readApiKey = "RHMDATRBIO029GKN"; 

        function fetchTrackerData() {
            const url = `https://thingspeak.com{channelId}/feeds.json?api_key=${readApiKey}&results=5`;

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    const lastUpdated = new Date().toLocaleTimeString();
                    statusBar.innerText = "🟢 System Active (Refreshed: " + lastUpdated + ")";
                    statusBar.style.color = "green";

                    // Read the location feeds
                    data.feeds.forEach(feed => {
                        // Read coordinates directly from data fields matching your successful test link
                        const lat = parseFloat(feed.field1);
                        const lon = parseFloat(feed.field2);
                        const name = feed.field3 || "Unknown Tag";
                        const type = feed.field4 || "Tracker";
                        const deviceId = name.replace(/\s+/g, '-').toLowerCase();

                        if (!isNaN(lat) && !isNaN(lon)) {
                            if (markers[deviceId]) {
                                markers[deviceId].setLatLng([lat, lon]);
                                markers[deviceId].getPopup().setContent(`<b>${name}</b> (${type})<br>Last Seen: ${lastUpdated}`);
                            } else {
                                markers[deviceId] = L.marker([lat, lon]).addTo(map)
                                    .bindPopup(`<b>${name}</b> (${type})<br>Last Seen: ${lastUpdated}`);
                                map.panTo([lat, lon]); // Centers map onto the active pin
                            }
                        }
                    });
                })
                .catch(error => {
                    console.error("API Fetch Error:", error);
                    statusBar.innerText = "🔴 API Connection Failed";
                    statusBar.style.color = "red";
                });
        }

        // Run instantly on launch, then update automatically every 15 seconds
        fetchTrackerData();
        setInterval(fetchTrackerData, 15000);
    </script>
</body>
</html>
